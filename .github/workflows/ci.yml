name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS / TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build --filter='!@terrasentry/api'
        env:
          VITE_API_BASE_URL: http://localhost:8000

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked --all-packages
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run pyright
      - name: Test
        run: uv run pytest

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked --all-packages
      - name: Regenerate client
        run: pnpm gen:api
      - name: Fail on drift
        run: |
          git diff --exit-code -- \
            packages/api-client/openapi.json \
            packages/api-client/src/schema.d.ts

  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrasentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terrasentry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/terrasentry
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --locked --all-packages
      - name: Upgrade to head
        run: uv run alembic -c apps/api/alembic.ini upgrade head
      - name: Fail on model/migration drift
        run: uv run alembic -c apps/api/alembic.ini check

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
          - image: api
            dockerfile: apps/api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
