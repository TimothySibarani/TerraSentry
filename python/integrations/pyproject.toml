[project]
name = "terrasentry-integrations"
version = "0.1.0"
description = "External gateways: Global Forest Watch, NASA FIRMS, and SAP."
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "tenacity>=9.0",
  "aiolimiter>=1.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "shapely>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
