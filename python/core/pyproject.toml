[project]
name = "terrasentry-core"
version = "0.1.0"
description = "TerraSentry domain core: agents, tools, evidence, scoring, and DDS generation."
requires-python = ">=3.13"
dependencies = [
  "terrasentry-integrations",
  "strands-agents[litellm]>=1.0",
  "pydantic>=2.10",
  "shapely>=2.1",
  "pyproj>=3.7",
]

[tool.uv.sources]
terrasentry-integrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
