[project]
name = "terrasentry-api"
version = "0.1.0"
description = "TerraSentry backend: REST API, SSE streams, batch runs, and persistence."
requires-python = ">=3.13"
dependencies = [
  "terrasentry-core",
  "fastapi[standard]>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "sse-starlette>=2.1",
  "structlog>=24.4",
]

[tool.uv.sources]
terrasentry-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
