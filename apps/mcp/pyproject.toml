[project]
name = "terrasentry-mcp"
version = "0.1.0"
description = "MCP server: lets Claude Code and other agents screen suppliers and read evidence through the TerraSentry API."
requires-python = ">=3.13"
dependencies = [
  "mcp>=2.1,<3",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
