action_groups:
  - actions:
      - type: status-update
        message: Asking TerraSentry...
      - type: agent-request
        system_alias: TERRASENTRY_AGENT
        agent_type: remote
        result_variable: "apiResponse"
      - type: message
        message:
          type: text
          markdown: true
          content: "<? apiResponse.body.artifacts[0].parts[0].text ?>"
