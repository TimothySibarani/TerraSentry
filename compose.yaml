name: terrasentry

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite+aiosqlite:////app/data/sqlite/audit.db
      CACHE_BACKEND: sqlite
      CACHE_SQLITE_PATH: /app/data/sqlite/cache.db
      API_CORS_ORIGINS: http://localhost:3000
      SAP_MODE: ${SAP_MODE:-stub}
      AGENT_MODEL: ${AGENT_MODEL:-scripted}
      AUTO_SEED: ${AUTO_SEED:-true}
      SEED_DATA_DIR: ${SEED_DATA_DIR:-data/seed}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-4}
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/app/data/sqlite

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  sqlite-data:
